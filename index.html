<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园外卖专送系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fa fa-cutlery"></i>
            <span>校园外卖专送</span>
        </div>
        <div class="header-right">
            <div class="role-buttons">
                <button class="btn btn-secondary" onclick="window.location.href='canteen.html'">
                    <i class="fa fa-building"></i> 食堂登录
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='deliveryman.html'">
                    <i class="fa fa-bike"></i> 配送员登录
                </button>
            </div>
            <div class="user-area" id="userArea">
                <button id="loginBtn" class="btn btn-primary">
                    <i class="fa fa-user"></i> 学生登录
                </button>
            </div>
        </div>
    </header>

    <main>
        <section id="menuSection">
            <div class="section-header">
                <h2>第一食堂菜单</h2>
                <div class="filter-bar">
                    <button class="filter-btn active" data-category="all">全部</button>
                    <button class="filter-btn" data-category="hot">热销</button>
                    <button class="filter-btn" data-category="new">新品</button>
                    <button class="filter-btn" data-category="discount">优惠</button>
                </div>
            </div>
            <div class="menu-grid" id="menuGrid">
                <div class="loading">加载中...</div>
            </div>
        </section>

        <div class="cart-overlay" id="cartOverlay"></div>
        <div class="cart-panel" id="cartPanel">
            <div class="cart-header">
                <h3>购物车</h3>
                <button class="close-cart" onclick="closeCart()">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="cart-items" id="cartItems">
                <p class="empty-cart">购物车为空</p>
            </div>
            <div class="cart-footer">
                <div class="total">
                    <span>合计：</span>
                    <span class="total-price">¥0</span>
                </div>
                <div class="address-input">
                    <input type="text" id="deliveryAddress" placeholder="请输入配送地址（如：男生宿舍3号楼）">
                </div>
                <button class="btn btn-primary checkout-btn" id="checkoutBtn" onclick="checkout()">去结算</button>
            </div>
        </div>
    </main>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>学生登录</h3>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form class="login-form" id="studentLoginForm">
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="studentId" placeholder="请输入学号（如：2024001）">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="studentPassword" placeholder="请输入密码（如：123456）">
                </div>
                <div class="form-group">
                    <span class="balance-info" id="balanceInfo"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">登录</button>
            </form>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content success-content">
            <div class="success-icon">
                <i class="fa fa-check-circle"></i>
            </div>
            <h3>下单成功！</h3>
            <p id="successMessage"></p>
            <button class="btn btn-primary btn-full" onclick="closeModal()">确定</button>
        </div>
    </div>

    <div class="modal" id="errorModal">
        <div class="modal-content error-content">
            <div class="error-icon">
                <i class="fa fa-times-circle"></i>
            </div>
            <h3>操作失败</h3>
            <p id="errorMessage"></p>
            <button class="btn btn-primary btn-full" onclick="closeModal()">确定</button>
        </div>
    </div>

    <div class="cart-icon-wrapper" id="cartIconWrapper">
        <div class="cart-icon" id="cartIcon">
            <i class="fa fa-shopping-cart"></i>
            <span class="cart-count">0</span>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>服务时间</h4>
                <p>早餐：7:00-9:00</p>
                <p>午餐：11:00-13:00</p>
                <p>晚餐：17:00-19:00</p>
            </div>
            <div class="footer-section">
                <h4>联系我们</h4>
                <p><i class="fa fa-phone"></i> 400-123-4567</p>
                <p><i class="fa fa-envelope"></i> service@campus.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 校园外卖专送系统 版权所有</p>
        </div>
    </footer>

    <script src="js/student.js"></script>
</body>
</html>
