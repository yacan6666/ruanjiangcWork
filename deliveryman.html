<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送员管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="deliveryman-body">
    <div class="login-page" id="loginPage">
        <div class="login-container">
            <div class="login-logo">
                <i class="fa fa-bike"></i>
                <h2>配送员管理系统</h2>
            </div>
            <form class="login-form" id="deliverymanLoginForm">
                <div class="form-group">
                    <label>配送员ID</label>
                    <input type="text" id="deliverymanId" placeholder="请输入配送员ID（如：d001）">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="deliverymanPassword" placeholder="请输入密码（如：delivery123）">
                </div>
                <button type="submit" class="btn btn-primary btn-full">登录</button>
                <p class="back-link" onclick="goBack()">返回首页</p>
            </form>
        </div>
    </div>

    <div class="dashboard-page" id="dashboardPage" style="display: none;">
        <header class="dashboard-header">
            <div class="header-left">
                <i class="fa fa-bike"></i>
                <span>配送员管理系统</span>
            </div>
            <div class="header-right">
                <span id="deliverymanName">张师傅</span>
                <button class="btn btn-outline" onclick="logout()">退出登录</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="stats-row">
                <div class="stat-card ready">
                    <div class="stat-icon">
                        <i class="fa fa-clock-o"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-num" id="readyCount">0</span>
                        <span class="stat-text">待抢单</span>
                    </div>
                </div>
                <div class="stat-card delivering">
                    <div class="stat-icon">
                        <i class="fa fa-bike"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-num" id="deliveringCount">0</span>
                        <span class="stat-text">配送中</span>
                    </div>
                </div>
                <div class="stat-card completed">
                    <div class="stat-icon">
                        <i class="fa fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <span class="stat-num" id="completedCount">0</span>
                        <span class="stat-text">已完成</span>
                    </div>
                </div>
            </div>

            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('ready')">待抢单</button>
                    <button class="tab-btn" onclick="showTab('delivering')">配送中</button>
                </div>

                <div class="tab-content">
                    <div class="tab-panel active" id="readyPanel">
                        <div class="order-list" id="readyOrders">
                            <p class="empty-state">暂无待抢订单</p>
                        </div>
                    </div>

                    <div class="tab-panel" id="deliveringPanel">
                        <div class="order-list" id="deliveringOrders">
                            <p class="empty-state">暂无配送中订单</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal" id="orderDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>订单详情</h3>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="order-detail" id="orderDetail">
            </div>
            <div class="modal-actions" id="modalActions">
            </div>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content success-content">
            <div class="success-icon">
                <i class="fa fa-check-circle"></i>
            </div>
            <h3>操作成功！</h3>
            <p id="successMessage"></p>
            <button class="btn btn-primary btn-full" onclick="closeModal()">确定</button>
        </div>
    </div>

    <div class="modal" id="errorModal">
        <div class="modal-content error-content">
            <div class="error-icon">
                <i class="fa fa-times-circle"></i>
            </div>
            <h3>操作失败</h3>
            <p id="errorMessage"></p>
            <button class="btn btn-primary btn-full" onclick="closeModal()">确定</button>
        </div>
    </div>

    <script src="js/deliveryman.js"></script>
</body>
</html>
